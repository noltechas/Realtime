<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background gradient: deep violet → magenta → cyan, matching the neon-on-dark palette -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#1a0b3a"/>
      <stop offset="35%"  stop-color="#5b1ea8"/>
      <stop offset="70%"  stop-color="#c81e8a"/>
      <stop offset="100%" stop-color="#ff5e3a"/>
    </linearGradient>

    <!-- Glow behind the mic -->
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.55">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="40%"  stop-color="#ffd1ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle inner highlight along the top edge -->
    <linearGradient id="topShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="35%"  stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft drop shadow for the mic -->
    <filter id="micShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="11" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- macOS Big Sur+ icon template: 824×824 body centered in 1024×1024 (≈80% safe area)
         Corner radius ≈ 185 (≈22.5% of body). The remaining 100px on each side is transparent
         so the dock sizes our icon consistently with Apple's stock icons. -->
    <clipPath id="squircleClip">
      <rect x="100" y="100" width="824" height="824" rx="185" ry="185"/>
    </clipPath>
  </defs>

  <!-- Background squircle, sized to the macOS safe area -->
  <g clip-path="url(#squircleClip)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>

    <!-- Decorative concentric soundwave rings, very subtle. Centered on the mic at (512, 549). -->
    <g fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2.5">
      <circle cx="512" cy="549" r="210"/>
      <circle cx="512" cy="549" r="275"/>
      <circle cx="512" cy="549" r="340"/>
      <circle cx="512" cy="549" r="405"/>
    </g>

    <!-- Glow under the mic -->
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>

    <!-- Top edge highlight for that glossy app-icon feel -->
    <rect x="100" y="100" width="824" height="824" fill="url(#topShine)"/>

    <!-- Microphone (game-icons__microphone) — paths sit roughly at (70,29)–(480,482) in a 512 viewBox.
         Scale 1.0 → 512px (≈62% of the 824 body, a comfortable size). Centered at (512, 512). -->
    <g transform="translate(237 257) scale(1.0)" fill="#ffffff" filter="url(#micShadow)">
      <path d="M388.938 29.47c-23.008 0-46.153 9.4-62.688 25.405c5.74 46.14 21.326 75.594 43.75 94.28c22.25 18.543 52.078 26.88 87.75 28.345c13.432-16.07 21.188-37.085 21.188-58c0-23.467-9.75-47.063-26.344-63.656C436 39.25 412.404 29.47 388.938 29.47m-76.282 42.374c-8.808 14.244-13.75 30.986-13.75 47.656c0 23.467 9.782 47.063 26.375 63.656c16.595 16.594 40.19 26.375 63.658 26.375c18.678 0 37.44-6.196 52.687-17.093c-31.55-3.2-59.626-12.46-81.875-31c-23.277-19.397-39.553-48.64-47.094-89.593zm-27.78 67.72l-64.47 83.78c2.898 19.6 10.458 35.1 22.094 46.187c11.692 11.142 27.714 18.118 48.594 19.626l79.312-65.28c-21.2-3.826-41.14-14.11-56.437-29.407c-14.927-14.927-25.057-34.286-29.095-54.907zM300 201.468h.03a8 8 0 0 1 .533 0a8 8 0 0 1 5.875 13.374l-34.313 38.78a8.004 8.004 0 1 1-12-10.593l34.313-38.78a8 8 0 0 1 5.562-2.78zM207.594 240L103 375.906c3.487 13.327 7.326 20.944 12.5 26.03c5.03 4.948 12.386 8.46 23.563 12.408l135.312-111.438c-17.067-3.61-31.595-11.003-42.906-21.78c-11.346-10.81-19.323-24.827-23.876-41.126zM95.97 402.375c-9.12 5.382-17.37 14.08-23.126 24.406c-9.656 17.317-11.52 37.236-2.25 50.47c6.665 4.337 10.566 4.81 13.844 4.344c1.794-.256 3.618-.954 5.624-1.875c-3.18-9.575-6.3-20.93-2.5-33.314c3.03-9.87 10.323-19.044 23.47-27.5a49.5 49.5 0 0 1-6.75-5.562c-3.217-3.163-5.94-6.78-8.313-10.97z"/>
    </g>

    <!-- Star sparkles around the mic (kept inside the 824 body) -->
    <g fill="#ffffff" opacity="0.85">
      <path d="M770 250 l7 24 24 7 -24 7 -7 24 -7 -24 -24 -7 24 -7 z"/>
      <path d="M250 370 l5 16 16 5 -16 5 -5 16 -5 -16 -16 -5 16 -5 z"/>
      <path d="M790 680 l5 19 19 5 -19 5 -5 19 -5 -19 -19 -5 19 -5 z"/>
    </g>
  </g>
</svg>
