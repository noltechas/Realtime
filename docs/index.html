<body>
<script>
// Silent error trap. Persists the last 20 uncaught JS errors to localStorage
// so we can recover them after a crash. The visible UI (red banner + 🐞
// button + clipboard dump) is mounted only when '?debug' is in the URL —
// see js/error-logger.js.
(function(){
  var LS='karaoke_error_log';
  function read(){try{return JSON.parse(localStorage.getItem(LS)||'[]');}catch(e){return[];}}
  function pushErr(e){
    try{localStorage.setItem(LS,JSON.stringify(read().concat([e]).slice(-20)));}catch(e){}
  }
  window.__pushErr=pushErr;
  window.addEventListener('error',function(ev){
    pushErr({time:new Date().toISOString(),message:(ev.error&&ev.error.message)||ev.message||'Unknown',source:ev.filename||'',line:ev.lineno||0,col:ev.colno||0,stack:(ev.error&&ev.error.stack)||''});
  },true);
  window.addEventListener('unhandledrejection',function(ev){
    var r=ev.reason;
    pushErr({time:new Date().toISOString(),message:(r&&r.message)||String(r)||'Unhandled rejection',source:'',line:0,col:0,stack:(r&&r.stack)||''});
  });
  // Clean up old debug keys from earlier versions
  try{localStorage.removeItem('karaoke_lifecycle');localStorage.removeItem('karaoke_last_hb');}catch(e){}
})();
</script>
<div class="mesh-bg"></div>
<div id="notif-container"></div>
<div class="app" id="app"></div>
<div id="bn-mount"></div>
<div id="overlay-mount"></div>
